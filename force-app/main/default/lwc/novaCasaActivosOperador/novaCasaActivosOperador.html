<template>
    <div class="lwc">
        <!-- Header -->
        <div class="comp-cab">
            <h1 class="comp-titulo">Mis activos</h1>
            <div class="comp-cab-der">
                <span class="comp-conteo">{countText}</span>
                <template if:true={showIngest}>
                    <button type="button" class="boton secundario" aria-expanded={ingestOpen} onclick={toggleIngest}>{ingestToggleLabel}</button>
                </template>
                <button type="button" class="boton secundario" disabled={isBusy} onclick={handleRefresh}>Actualizar</button>
            </div>
        </div>

        <!-- Admin only: pull signals from the simulator -->
        <template if:true={showIngest}>
            <template if:true={ingestOpen}>
                <section class="panel-ingesta" aria-label="Traer señales del simulador">
                    <div class="filtros">
                        <label class="filtro-label" for="i-escenario">Escenario</label>
                        <select class="campo" id="i-escenario" disabled={ingestRunning} onchange={handleScenario}>
                            <template for:each={scenarioOptions} for:item="opt">
                                <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                            </template>
                        </select>
                        <label class="filtro-label" for="i-paginas">Páginas (1 a 25)</label>
                        <input class="campo" id="i-paginas" type="number" min="1" max="25" value={ingestPages} disabled={ingestRunning} onchange={handleIngestPages} />
                        <input id="i-reiniciar" type="checkbox" checked={ingestRestart} disabled={ingestRunning} onchange={handleIngestRestart} />
                        <label class="filtro-label" for="i-reiniciar">Reiniciar sesión</label>
                        <button type="button" class="boton urgente" disabled={ingestRunning} onclick={handleStartIngest}>Traer señales</button>
                    </div>
                    <p class="nota">Crea lecturas, registros de log y casos reales. Una sola corrida a la vez; avisa al equipo antes de lanzarla. Cada corrida continúa donde quedó la anterior; marca «Reiniciar sesión» para empezar otra vez desde el primer mensaje del simulador.</p>
                    <template if:true={hasIngestState}>
                        <p class="nota" role="status" aria-live="polite">{ingestSummary}</p>
                        <template if:true={hasIngestDetail}>
                            <p class="nota" role="status" aria-live="polite">{ingestDetail}</p>
                        </template>
                    </template>
                    <template if:true={ingestError}>
                        <p class="nota nota-error" role="alert">{ingestError}</p>
                    </template>
                </section>
            </template>
        </template>

        <!-- Loading: skeleton -->
        <template if:true={isBusy}>
            <div role="status" aria-live="polite">
                <span class="solo-lectura">Cargando activos</span>
                <div class="hueso situacion-hueso" aria-hidden="true"></div>
                <div class="esqueleto" aria-hidden="true">
                    <div class="hueso alto"></div>
                    <div class="hueso alto"></div>
                    <div class="hueso alto"></div>
                </div>
            </div>
        </template>

        <!-- Error -->
        <template if:true={showError}>
            <div class="estado-centro" role="alert">
                <div class="estado-icono error" aria-hidden="true">&#9888;</div>
                <p class="estado-titulo">No pudimos cargar tus activos</p>
                <p class="estado-texto">
                    Esta lista no muestra el estado actual. No asumas que todo está normal. Vuelve a intentar; si sigue, avisa a tu administrador.
                </p>
                <p class="estado-detalle">{errorMessage}</p>
                <button type="button" class="boton urgente" onclick={handleRefresh}>Reintentar</button>
            </div>
        </template>

        <!-- Banner -->
        <template if:true={showSummary}>
            <div class={bannerClass} role="status">
                <p class="lead"><em>{leadStrong}</em> {leadRest}</p>
                <div class="situacion-meta">
                    <span>En esta vista:</span>
                    <span class="chip chip-critico">{criticalChip}</span>
                    <span class="chip chip-advertencia">{warningChip}</span>
                    <span class="chip chip-normal">{normalChip}</span>
                    <template if:true={noReadingCount}>
                        <span class="chip chip-nivel">{noReadingChip}</span>
                    </template>
                    <template if:true={updatedText}>
                        <span>Actualizado a las {updatedClock} <span class="frescor">({updatedText})</span></span>
                    </template>
                </div>
            </div>
        </template>

        <!-- Summary per building: everyone sees it -->
        <template if:true={showBuildingSummary}>
            <section class="resumen-edificios" aria-label="Resumen por edificio">
                <p class="nota">{buildingSummaryNote}</p>
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Edificio</th>
                            <th scope="col">Activos</th>
                            <th scope="col">Críticos</th>
                            <th scope="col">Precaución</th>
                            <th scope="col">Sin dato</th>
                            <th scope="col">Desactualizados</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={buildingSummary} for:item="b">
                            <tr key={b.key} class={b.rowClass}>
                                <td class="celda-fuerte">{b.name}</td>
                                <td class="num">{b.total}</td>
                                <td class="num">{b.critical}</td>
                                <td class="num">{b.warning}</td>
                                <td class="num">{b.noData}</td>
                                <td class="num">{b.stale}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </section>
        </template>

        <!-- Filters -->
        <template if:true={showFilters}>
            <div class="filtros">
                <span class="filtro-label">Filtrar</span>
                <label class="filtro-label" for="f-edificio">Edificio</label>
                <select class="campo" id="f-edificio" name="buildingId" disabled={buildingsDisabled} onchange={handleFilterChange}>
                    <template for:each={buildingOptions} for:item="opt">
                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                    </template>
                </select>
                <label class="filtro-label" for="f-severidad">Severidad</label>
                <select class="campo" id="f-severidad" name="severity" onchange={handleFilterChange}>
                    <template for:each={severityOptions} for:item="opt">
                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                    </template>
                </select>
                <template if:true={hasTypeOptions}>
                    <label class="filtro-label" for="f-tipo">Tipo de activo</label>
                    <select class="campo" id="f-tipo" name="assetType" onchange={handleFilterChange}>
                        <template for:each={typeOptions} for:item="opt">
                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                        </template>
                    </select>
                </template>
                <template if:true={filtersActive}>
                    <button type="button" class="boton secundario" onclick={handleClearFilters}>Limpiar filtros</button>
                </template>
            </div>
            <template if:true={buildingsTruncated}>
                <p class="nota" role="status">Lista de edificios incompleta.</p>
            </template>
            <template if:true={buildingsError}>
                <p class="nota nota-error" role="alert">No se pudo cargar la lista de edificios: {buildingsError}</p>
            </template>
        </template>

        <!-- Empty: nothing visible to this user -->
        <template if:true={showEmptyNoData}>
            <div class="estado-centro" role="status">
                <div class="estado-icono vacio" aria-hidden="true">&#9633;</div>
                <p class="estado-titulo">No hay activos para mostrar</p>
                <p class="estado-texto">
                    Todavía no hay activos a los que tengas acceso, o aún no se ha cargado el catálogo.
                    Si esperabas ver activos, consulta con tu administrador.
                </p>
                <button type="button" class="boton secundario" onclick={handleRefresh}>Actualizar</button>
            </div>
        </template>

        <!-- Empty: filters exclude everything -->
        <template if:true={showEmptyNoMatch}>
            <div class="estado-centro" role="status">
                <div class="estado-icono vacio" aria-hidden="true">&#9633;</div>
                <p class="estado-titulo">Ningún activo coincide con esos filtros</p>
                <button type="button" class="boton secundario" onclick={handleClearFilters}>Limpiar filtros</button>
            </div>
        </template>

        <template if:true={showTruncated}>
            <p class="aviso-truncado" role="status"><span aria-hidden="true">&#9650;</span> {truncatedText}</p>
        </template>

        <!-- Screen 1: list -->
        <template if:true={showList}>
            <div class="lista-activos">
                <template for:each={rows} for:item="row">
                    <article key={row.key} class={row.cardClass} data-id={row.assetId} onclick={handleViewAsset}>
                        <div class="tipo-ico" aria-hidden="true">
                            <template if:true={row.isPump}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="11" width="10" height="8" rx="1.5"/><path d="M12 11V6M9 6h6"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg>
                            </template>
                            <template if:true={row.isVentilation}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.2"/><path d="M12 4.5v3.2M12 16.3v3.2M4.5 12h3.2M16.3 12h3.2M6.4 6.4l2.3 2.3M15.3 15.3l2.3 2.3M17.6 6.4l-2.3 2.3M8.7 15.3l-2.3 2.3"/></svg>
                            </template>
                            <template if:true={row.isOtherType}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9z"/></svg>
                            </template>
                        </div>
                        <div class="identidad">
                            <div class="fila-estado">
                                <span class={row.sevClass}><span class="glifo" aria-hidden="true">{row.sevGlyph}</span> {row.sevLabel}</span>
                                <template if:true={row.hasBuilding}>
                                    <span class="edificio">{row.buildingName}</span>
                                </template>
                            </div>
                            <p class="nombre-activo">{row.name}</p>
                            <p class="meta-activo">{row.metaText}</p>
                            <p class={row.signalClass}>{row.signalText}</p>
                        </div>
                        <div class="cluster">
                            <div class="lectura-bloque">
                                <template if:true={row.hasHeadline}>
                                    <span class="lectura-valor">{row.headValue}</span>
                                    <span class="lectura-tipo">{row.headMeasure}</span>
                                    <template if:true={row.hasMoreReadings}>
                                        <span class="lectura-tipo">{row.moreReadingsText}</span>
                                    </template>
                                </template>
                                <template if:false={row.hasHeadline}>
                                    <span class="lectura-tipo">Sin lecturas todavía</span>
                                </template>
                            </div>
                            <button type="button" class={row.viewButtonClass} data-id={row.assetId} aria-label={row.viewLabel} onclick={handleViewAssetButton}>Ver activo</button>
                        </div>
                    </article>
                </template>
            </div>
        </template>

        <!-- Screen 2: asset detail -->
        <template if:true={showDetail}>
            <div class="detalle-grid">
                <nav class="miga" aria-label="Ruta de navegación">
                    <button type="button" class="enlace" onclick={handleBackToList}>Mis activos</button>
                    <span aria-hidden="true"> &rsaquo; </span>
                    <span aria-current="page">{selectedRow.name}</span>
                    <button type="button" class="enlace enlace-der" data-id={selectedRow.assetId} onclick={handleOpenAsset}>Abrir registro del activo</button>
                    <template if:true={caps.puedeVerLimites}>
                        <button type="button" class="enlace enlace-der" onclick={handleOpenThresholds}>Ver límites</button>
                    </template>
                </nav>

                <section class={selectedRow.heroClass} aria-label="Resumen del activo">
                    <div class="tipo-ico" aria-hidden="true">
                        <template if:true={selectedRow.isPump}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="11" width="10" height="8" rx="1.5"/><path d="M12 11V6M9 6h6"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg>
                        </template>
                        <template if:true={selectedRow.isVentilation}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.2"/><path d="M12 4.5v3.2M12 16.3v3.2M4.5 12h3.2M16.3 12h3.2M6.4 6.4l2.3 2.3M15.3 15.3l2.3 2.3M17.6 6.4l-2.3 2.3M8.7 15.3l-2.3 2.3"/></svg>
                        </template>
                        <template if:true={selectedRow.isOtherType}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9z"/></svg>
                        </template>
                    </div>
                    <div>
                        <template if:true={selectedRow.hasTypeLabel}>
                            <span class="hero-tipo">{selectedRow.typeLabel}</span>
                        </template>
                        <h2 class="hero-nombre" tabindex="-1" data-focus="detail">{selectedRow.name}</h2>
                        <ul class="fichas">
                            <template if:true={selectedRow.hasBuilding}>
                                <li class="ficha"><b>Edificio</b> {selectedRow.buildingName}</li>
                            </template>
                            <template if:true={selectedRow.hasExternalId}>
                                <li class="ficha"><b>ID</b> {selectedRow.externalId}</li>
                            </template>
                        </ul>
                    </div>
                    <span class={selectedRow.sevClass}><span class="glifo" aria-hidden="true">{selectedRow.sevGlyph}</span> {selectedRow.sevLabel}</span>
                </section>

                <div class="prio">
                    <div class="prio-card">
                        <span class="rot">Severidad del activo</span>
                        <span class={selectedRow.sevValueClass}>{selectedRow.sevLabel}</span>
                        <span class="sub">{selectedRow.sevSub}</span>
                    </div>
                    <div class="prio-card">
                        <span class="rot">Última lectura</span>
                        <template if:true={selectedRow.hasLast}>
                            <span class="val">{selectedRow.lastValue}</span>
                        </template>
                        <template if:false={selectedRow.hasLast}>
                            <span class="val val-nivel">—</span>
                        </template>
                        <span class="sub">{selectedRow.lastSub}</span>
                        <span class="sub">{selectedRow.signalText}</span>
                    </div>
                </div>

                <template if:true={selectedRow.hasIntervention}>
                    <section class="card-intervencion" aria-label="Intervención en curso">
                        <div>
                            <span class="rot">Intervención · {selectedRow.caseStatus}</span>
                            <p class="val">
                                <button type="button" class="enlace-rojo" data-id={selectedRow.caseId} onclick={handleOpenCase}>Caso {selectedRow.caseNumber}</button>
                            </p>
                            <template if:true={selectedRow.hasCaseSubject}>
                                <p>{selectedRow.caseSubject}</p>
                            </template>
                            <p>{selectedRow.caseAgeText}</p>
                            <template if:true={selectedRow.hasMoreInterventions}>
                                <p>{selectedRow.moreInterventionsText}</p>
                            </template>
                            <div class="acciones-form acciones-int">
                                <template if:true={selectedRow.canFollow}>
                                    <button type="button" class="boton secundario" data-mode="seguir" onclick={openForm}>Actualizar seguimiento</button>
                                </template>
                                <template if:true={selectedRow.canCloseAll}>
                                    <button type="button" class="boton secundario" data-mode="cerrar-todas" onclick={openForm}>{selectedRow.closeAllLabel}</button>
                                </template>
                            </div>
                        </div>
                    </section>
                </template>
                <template if:false={selectedRow.hasIntervention}>
                    <section class="card-sin-int" aria-label="Intervención">
                        <div>
                            <span class="rot">Intervención</span>
                            <p class="val">Ninguna abierta</p>
                            <p>{selectedRow.noInterventionText}</p>
                            <template if:true={selectedRow.canCreate}>
                                <button type="button" class="boton urgente" data-mode="crear" onclick={openForm}>Crear intervención</button>
                            </template>
                        </div>
                    </section>
                </template>

                <template if:true={formMode}>
                    <section class="card-extra form-accion" aria-label="Acción sobre la intervención">
                        <template if:true={isCreating}>
                            <h3>Crear intervención</h3>
                            <label class="filtro-label" for="a-motivo">Motivo (obligatorio)</label>
                            <textarea class="campo campo-texto" id="a-motivo" maxlength="1000" rows="3" value={motivo} oninput={handleMotivo}></textarea>
                        </template>
                        <template if:true={isFollowing}>
                            <h3>Actualizar seguimiento</h3>
                            <template if:true={hasFollowUpOptions}>
                                <label class="filtro-label" for="a-estado">Estado</label>
                                <select class="campo" id="a-estado" onchange={handleEstado}>
                                    <template for:each={followUpOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                    </template>
                                </select>
                            </template>
                            <template if:true={followUpLoading}>
                                <p class="nota" role="status" aria-live="polite">Cargando los estados…</p>
                            </template>
                            <template if:true={followUpUnavailable}>
                                <p class="nota nota-error" role="alert">{followUpNote}</p>
                            </template>
                            <label class="filtro-label" for="a-comentario">Comentario (opcional)</label>
                            <textarea class="campo campo-texto" id="a-comentario" maxlength="4000" rows="3" value={comentario} oninput={handleComentario}></textarea>
                        </template>
                        <template if:true={isClosingAll}>
                            <h3>Cerrar todas las intervenciones abiertas</h3>
                            <p class="nota">{selectedRow.closeAllWarning}</p>
                            <label class="filtro-label" for="a-comentario-todas">Comentario (opcional)</label>
                            <textarea class="campo campo-texto" id="a-comentario-todas" maxlength="4000" rows="3" value={comentario} oninput={handleComentario}></textarea>
                        </template>
                        <template if:true={showActionError}>
                            <p class="nota nota-error" role="alert">{actionError}</p>
                        </template>
                        <div class="acciones-form">
                            <button type="button" class="boton urgente" disabled={saveDisabled} onclick={handleSaveForm}>{saveLabel}</button>
                            <button type="button" class="boton secundario" disabled={isSaving} onclick={closeForm}>Cancelar</button>
                        </div>
                    </section>
                </template>

                <p class="extra-label">Más información</p>
                <section class="card-extra">
                    <h3>Lectura vigente por tipo</h3>
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Medición</th>
                                <th scope="col">Valor</th>
                                <th scope="col">Severidad</th>
                                <th scope="col">Antigüedad</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={selectedRow.tableRows} for:item="t">
                                <tr key={t.key}>
                                    <td class="celda-fuerte">{t.measurementLabel}</td>
                                    <template if:true={t.hasReading}>
                                        <td class="num">{t.valueText}</td>
                                        <td><span class={t.sevClass}><span class="glifo" aria-hidden="true">{t.sevGlyph}</span> {t.sevLabel}</span></td>
                                        <td class="num">{t.ageText}</td>
                                    </template>
                                    <template if:false={t.hasReading}>
                                        <td class="celda-sub">Sin lecturas</td>
                                        <td class="celda-sub">—</td>
                                        <td class="celda-sub">—</td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </section>

                <section class="card-extra" aria-label="Historial de señales">
                    <h3>Historial de señales</h3>
                    <c-nova-casa-historial-senales asset-id={selectedAssetId}></c-nova-casa-historial-senales>
                </section>
            </div>
        </template>
    </div>
</template>
