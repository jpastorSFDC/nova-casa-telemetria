<template>
    <lightning-card title="Estado del edificio" icon-name="standard:account">
        <lightning-button slot="actions" label="Actualizar" variant="neutral" size="small" disabled={isLoading} onclick={handleRefresh}></lightning-button>
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_small">
            <template if:true={isLoading}>
                <div role="status" aria-live="polite">
                    <span class="slds-assistive-text">Cargando el estado del edificio</span>
                    <lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner>
                    <div class="hueso" aria-hidden="true"></div>
                </div>
            </template>

            <template if:true={showError}>
                <div class="slds-text-color_error" role="alert">
                    <p class="slds-text-heading_small">No pudimos cargar el estado del edificio</p>
                    <p>Este resumen no muestra el estado actual. No asumas que todo está normal. Vuelve a intentar; si sigue, avisa a tu administrador.</p>
                    <p class="slds-text-body_small">{errorMessage}</p>
                </div>
            </template>

            <template if:true={isEmpty}>
                <div role="status">
                    <p class="slds-text-heading_small">Sin activos para mostrar</p>
                    <p class="slds-text-color_weak">Este edificio no tiene activos a los que tengas acceso, o aún no se ha cargado el catálogo.</p>
                </div>
            </template>

            <template if:true={showSummary}>
                <div class={bannerClass}>
                    <p class="lead">
                        <em><template if:true={leadGlyph}><span class="glifo" aria-hidden="true">{leadGlyph}</span></template>{leadStrong}</em>{leadRest}
                    </p>
                    <div class="situacion-meta">
                        <template if:true={hasOpenCases}>
                            <strong><span class="glifo" aria-hidden="true">&#9650;</span>{openCasesText}</strong>
                        </template>
                        <template if:false={hasOpenCases}>
                            <span>{openCasesText}</span>
                        </template>
                        <span class="ultima-senal">
                            <template if:true={hasLastSignal}>
                                <span>{lastSignalText}</span>
                                <template if:true={lastSignalStale}>
                                    <span class="desactualizada">(desactualizada)</span>
                                </template>
                                <lightning-formatted-date-time class="fecha" value={lastSignalValue} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                            </template>
                            <template if:false={hasLastSignal}>Sin señales todavía</template>
                        </span>
                    </div>
                </div>
                <template if:true={isTruncated}>
                    <p class="slds-text-color_error slds-var-m-bottom_small" role="status">
                        <span aria-hidden="true">&#9650;</span> Resumen parcial: el edificio tiene más activos de los contados; las cifras son "al menos".
                    </p>
                </template>
                <div class="barra" aria-hidden="true">
                    <template for:each={segmentos} for:item="seg">
                        <span key={seg.key} class={seg.cls} style={seg.style}></span>
                    </template>
                </div>
                <ul class="grilla" aria-label="Activos por severidad">
                    <template for:each={items} for:item="it">
                        <li key={it.key} class={it.cardCls}>
                            <span class="cifra">{it.count}</span>
                            <span class={it.cls}><span aria-hidden="true">{it.glyph}</span> {it.label}</span>
                        </li>
                    </template>
                </ul>
                <template if:true={showAssetsError}>
                    <p class="slds-text-color_error aviso" role="alert">No pudimos cargar las lecturas actuales. {assetsError}</p>
                </template>
                <template if:true={showCards}>
                    <ul class="fichas" aria-label="Lo que necesita atención y la última señal recibida">
                        <template for:each={attentionCards} for:item="c">
                            <li key={c.key} class={c.cardCls}>
                                <div class="ficha-cab">
                                    <span class="rot">Necesita atención</span>
                                    <span class={c.sevCls}><span aria-hidden="true">{c.sevGlyph}</span> {c.sevLabel}</span>
                                </div>
                                <a href="#" class="ficha-nombre" data-id={c.assetId} onclick={handleOpenAsset}>{c.assetName}</a>
                                <span class="ficha-medicion">{c.measurement}</span>
                                <span class="ficha-valor">{c.valueText}</span>
                                <div class="ficha-pie">
                                    <span>
                                        <lightning-formatted-date-time value={c.occurredAt} month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                                        <template if:true={c.simulatorTime}><span class="sim">hora del simulador</span></template>
                                    </span>
                                    <template if:true={c.hasCase}>
                                        <lightning-button label={c.caseLabel} size="small" data-id={c.caseId} onclick={handleOpenCase}></lightning-button>
                                    </template>
                                    <template if:false={c.hasCase}>
                                        <span>Sin intervención abierta</span>
                                    </template>
                                </div>
                                <template if:true={c.hasOrigen}>
                                    <span class="ficha-origen">
                                        {c.origenTexto}
                                        <template if:true={c.hasOrigenAt}>
                                            <span class="sep-punto"><lightning-formatted-date-time value={c.origenAt} month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></span>
                                        </template>
                                    </span>
                                </template>
                            </li>
                        </template>
                        <template if:false={hasAttention}>
                            <li class="ficha ficha-normal">
                                <div class="ficha-cab">
                                    <span class="rot">Necesita atención</span>
                                    <span class="sev sev-normal"><span aria-hidden="true">○</span> Nada</span>
                                </div>
                                <span class="ficha-nombre-texto">Ningún activo en precaución ni crítico</span>
                            </li>
                        </template>
                        <template for:each={caseCards} for:item="k">
                            <li key={k.key} class={k.cardCls}>
                                <div class="ficha-cab">
                                    <span class="rot">Intervención abierta</span>
                                    <span class={k.sevCls}><span aria-hidden="true">{k.sevGlyph}</span> {k.sevLabel}</span>
                                </div>
                                <a href="#" class="ficha-nombre" data-id={k.assetId} onclick={handleOpenAsset}>{k.assetName}</a>
                                <span class="ficha-medicion">{k.statusText}</span>
                                <template if:true={k.hasOrigen}>
                                    <span class="ficha-origen">
                                        {k.origenTexto}
                                        <template if:true={k.hasOrigenAt}>
                                            <span class="sep-punto"><lightning-formatted-date-time value={k.origenAt} month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></span>
                                        </template>
                                    </span>
                                </template>
                                <div class="ficha-pie">
                                    <span></span>
                                    <lightning-button label={k.caseLabel} size="small" data-id={k.caseId} onclick={handleOpenCase}></lightning-button>
                                </div>
                            </li>
                        </template>
                        <li class={lastCardCls}>
                            <template if:true={lastCard}>
                                <div class="ficha-cab">
                                    <span class="rot">Última señal recibida</span>
                                    <span class={lastCard.sevCls}><span aria-hidden="true">{lastCard.sevGlyph}</span> {lastCard.sevLabel}</span>
                                </div>
                                <a href="#" class="ficha-nombre" data-id={lastCard.assetId} onclick={handleOpenAsset}>{lastCard.assetName}</a>
                                <span class="ficha-medicion">{lastCard.measurement}</span>
                                <span class="ficha-valor">{lastCard.valueText}</span>
                                <div class="ficha-pie">
                                    <span>
                                        <lightning-formatted-date-time value={lastCard.occurredAt} month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                                        <template if:true={lastCard.simulatorTime}><span class="sim">hora del simulador</span></template>
                                    </span>
                                </div>
                            </template>
                            <template if:false={lastCard}>
                                <div class="ficha-cab"><span class="rot">Última señal recibida</span></div>
                                <span class="ficha-nombre-texto">Sin señales todavía</span>
                            </template>
                        </li>
                    </ul>
                    <template if:true={attentionOverflowText}>
                        <p class="mas">{attentionOverflowText}</p>
                    </template>
                    <template if:true={caseOverflowText}>
                        <p class="mas">{caseOverflowText}</p>
                    </template>
                    <template if:true={aperturasFailed}>
                        <p class="mas" role="status">No se pudo cargar qué señal generó cada intervención.</p>
                    </template>
                    <template if:true={assetsTruncated}>
                        <p class="mas" role="status"><span aria-hidden="true">&#9650;</span> Vista parcial: el edificio tiene más activos de los revisados; puede haber más que necesiten atención o con intervención.</p>
                    </template>
                </template>
                <div class="calidad">
                    <span class="rot">Calidad de datos</span>
                    <span><b>{sinLectura}</b> sin lecturas</span>
                    <span><b>{sinNivel}</b> con señal sin nivel</span>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
