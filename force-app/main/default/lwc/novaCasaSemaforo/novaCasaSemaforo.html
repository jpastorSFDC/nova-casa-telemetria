<template>
    <div class={housingClass} role="img" aria-label={ariaLabel}>
        <span class={redClass}>
            <template if:true={isCritical}><span class="glifo" aria-hidden="true">&#9679;</span></template>
        </span>
        <span class={amberClass}>
            <template if:true={isWarning}><span class="glifo" aria-hidden="true">&#9650;</span></template>
            <template if:true={isUnknown}><span class="glifo" aria-hidden="true">?</span></template>
        </span>
        <span class={greenClass}>
            <template if:true={isStable}><span class="glifo" aria-hidden="true">&#9675;</span></template>
        </span>
    </div>
</template>
