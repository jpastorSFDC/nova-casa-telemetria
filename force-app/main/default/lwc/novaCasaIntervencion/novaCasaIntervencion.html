<template>
    <div class="nc">
        <template if:true={isLoading}>
            <div role="status" aria-live="polite">
                <span class="solo-lectura">Cargando la intervención</span>
                <div class="hueso hueso-cabecera" aria-hidden="true"></div>
                <div class="dos" aria-hidden="true">
                    <div class="hueso hueso-tarjeta"></div>
                    <div class="hueso hueso-tarjeta"></div>
                </div>
            </div>
        </template>

        <template if:true={showError}>
            <div class="tarjeta estado-centro" role="alert">
                <div class="estado-icono" aria-hidden="true">&#9888;</div>
                <p class="estado-titulo">No pudimos cargar la intervención</p>
                <p class="estado-texto">
                    Esta vista no muestra el estado actual de la intervención ni del activo. No asumas que todo está normal. Vuelve a intentar; si sigue, avisa a tu administrador.
                </p>
                <p class="estado-detalle">{errorMessage}</p>
                <button type="button" class="boton primario" onclick={handleRetry}>Reintentar</button>
            </div>
        </template>

        <template if:true={hasData}>
            <section class="tarjeta resumen" aria-label="Resumen de la intervención">
                <div class={bandClass}>
                    <span class="banda-texto">
                        <span class="solo-lectura">Estado actual del activo: </span>
                        <span aria-hidden="true">{bandGlyph}</span> {bandLabel}
                        <span class="banda-extra">{bandReading}</span>
                        <template if:true={showBandIncomplete}>
                            <span class="banda-nota">(lecturas incompletas)</span>
                        </template>
                    </span>
                    <template if:true={hasBandAge}>
                        <span class="banda-der">
                            {bandAgeText}
                            <template if:true={bandStale}>
                                <span class="antiguo"><span aria-hidden="true">&#9201;</span> Dato antiguo</span>
                            </template>
                        </span>
                    </template>
                </div>

                <div class="cabecera">
                    <c-nova-casa-ilustracion tipo={detalle.assetType} nivel={detalle.assetLevel} tamano="md"></c-nova-casa-ilustracion>
                    <div class="cabecera-texto">
                        <span class="eyebrow">{eyebrow}</span>
                        <h2 class="titulo">{caseTitle}</h2>
                        <p class="asunto">{subjectText}</p>
                        <template if:true={hasAsset}>
                            <div class="chips">
                                <button type="button" class="chip chip-enlace" data-id={detalle.assetId} onclick={handleOpenAsset}>
                                    <span class="solo-lectura">Activo: </span>{assetName} <span aria-hidden="true">&#8599;</span>
                                </button>
                                <template if:true={hasExternalId}>
                                    <span class="chip num"><span class="solo-lectura">Código del activo: </span>{detalle.assetExternalId}</span>
                                </template>
                                <template if:true={hasBuilding}>
                                    <button type="button" class="chip chip-enlace" data-id={detalle.accountId} onclick={handleOpenBuilding}>
                                        <span class="solo-lectura">Edificio: </span>{buildingName} <span aria-hidden="true">&#8599;</span>
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                    <span class={statusClass}><span class="solo-lectura">Estado de la intervención: </span>{statusLabel}</span>
                </div>

                <div class="franja">
                    <div class="franja-celda">
                        <span class="micro">{openTileLabel}</span>
                        <span class="val">{openTileValue}</span>
                        <span class="sub">{openTileSub}</span>
                    </div>
                    <div class="franja-celda">
                        <span class="micro">Prioridad</span>
                        <span class="val">{priorityText}</span>
                        <span class="sub">{prioritySub}</span>
                    </div>
                    <template if:true={hasLastCritical}>
                        <div class="franja-celda">
                            <span class="micro">Última crítica registrada</span>
                            <span class="val num">{lastCriticalValue}</span>
                            <span class="sub">{lastCriticalSub}</span>
                        </div>
                    </template>
                    <div class="franja-celda">
                        <span class="micro">Señales enlazadas</span>
                        <span class="val num">{linkedCount}</span>
                        <span class="sub">{signalsTileSub}</span>
                    </div>
                </div>
            </section>

            <div class="dos">
                <section class="tarjeta acciones-tarjeta">
                    <div class="tarjeta-cab">
                        <h3 class="tarjeta-titulo">¿Qué hacer ahora?</h3>
                    </div>
                    <div class="cuerpo">
                        <template if:true={showStableNote}>
                            <p class="aviso aviso-normal">
                                <span aria-hidden="true">&#9675;</span>
                                <span>Las lecturas actuales del activo están en rango. La intervención sigue abierta hasta que coordinación la cierre.</span>
                            </p>
                        </template>
                        <template if:true={showReceivesCriticalsNote}>
                            <p class="aviso aviso-info">
                                <span aria-hidden="true">&#9432;</span>
                                <span>Mientras siga abierta, las nuevas críticas de este activo se registran aquí y no abren otra intervención.</span>
                            </p>
                        </template>
                        <template if:true={isOpen}>
                            <p class="aviso aviso-info">
                                <span aria-hidden="true">&#9432;</span>
                                <span>El estado se cambia en la pestaña Detalles, con el lápiz junto a Estado. Si no ves el lápiz, el cambio lo hace coordinación.</span>
                            </p>
                        </template>

                        <template if:true={isClosed}>
                            <p class="aviso aviso-info">
                                <span>
                                    {closedDurationText}
                                </span>
                            </p>
                            <template if:true={closedAssetStillCritical}>
                                <p class="aviso aviso-critico">
                                    <span aria-hidden="true">&#9679;</span>
                                    <span>El activo sigue crítico: la próxima señal crítica puede abrir una intervención nueva.</span>
                                </p>
                            </template>
                        </template>
                    </div>
                </section>

                <section class="tarjeta senales">
                    <template if:true={isTelemetry}>
                        <div class="tarjeta-cab">
                            <h3 class="tarjeta-titulo">Señales de esta intervención</h3>
                            <span class="tarjeta-cab-nota">{signalsCountText}</span>
                        </div>
                        <template if:true={signalsLoading}>
                            <p class="nota cuerpo" role="status">Cargando señales…</p>
                        </template>
                        <template if:true={showSignalsError}>
                            <p class="nota nota-error cuerpo" role="alert">{signalsErrorMessage}</p>
                        </template>
                        <template if:true={showSignalsEmpty}>
                            <p class="nota cuerpo">{signalsEmptyText}</p>
                        </template>
                        <template if:true={showSignalsTable}>
                            <div class="tabla-desliza">
                                <table class="tabla">
                                    <caption class="solo-lectura">Señales enlazadas a esta intervención, de la más nueva a la más antigua</caption>
                                    <thead>
                                        <tr>
                                            <th scope="col">Hora de origen</th>
                                            <th scope="col">Medición</th>
                                            <th scope="col">Valor</th>
                                            <th scope="col">Resultado</th>
                                            <th scope="col"><span class="solo-lectura">Etiquetas</span></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={signalRows} for:item="s">
                                            <tr key={s.key} class={s.rowClass}>
                                                <td class="celda-hora">
                                                    <span class="num">{s.timeText}</span>
                                                    <template if:true={s.isFuture}>
                                                        <span class="edad"> · hora del simulador</span>
                                                    </template>
                                                </td>
                                                <td>{s.measurementLabel}</td>
                                                <td class={s.valueClass}>{s.valueText}</td>
                                                <td><span class="etq etq-res">{s.resultText}</span></td>
                                                <td class="celda-etq">
                                                    <template if:true={s.isLatest}>
                                                        <span class="etq etq-ultima">Última</span>
                                                    </template>
                                                    <template if:true={s.abrio}>
                                                        <span class="etq etq-abrio">Abrió la intervención</span>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <template if:true={showSignalsTruncated}>
                                <p class="nota cuerpo-nota">{signalsTruncatedText}</p>
                            </template>
                        </template>
                        <div class="pie">
                            <span>Solo las señales enlazadas a esta intervención.</span>
                            <template if:true={hasAsset}>
                                <button type="button" class="enlace" data-id={detalle.assetId} onclick={handleOpenAsset}>
                                    Ver historial completo del activo <span aria-hidden="true">&#8599;</span>
                                </button>
                            </template>
                        </div>
                    </template>

                    <template if:true={isManual}>
                        <div class="tarjeta-cab">
                            <h3 class="tarjeta-titulo">Intervención manual</h3>
                        </div>
                        <div class="cuerpo">
                            <template if:true={hasMotivo}>
                                <div>
                                    <span class="micro">Motivo</span>
                                    <p class="motivo">{motivo}</p>
                                </div>
                            </template>
                            <template if:false={hasMotivo}>
                                <p class="nota">Intervención creada a mano: no tiene señales enlazadas.</p>
                            </template>
                        </div>
                    </template>
                </section>
            </div>
        </template>
    </div>
</template>
